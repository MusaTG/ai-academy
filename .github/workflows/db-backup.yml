# İsteğe bağlı: barındırılan (ör. Neon) PostgreSQL veritabanının günlük, doğrulanmış ve ŞİFRELİ yedeği.
# Yalnızca DATABASE_URL ve BACKUP_PASSPHRASE sırları tanımlıysa çalışır. Yedek, repoya DEĞİL
# GitHub Actions artifact'ı olarak (şifreli) saklanır. Repoyu private tutmanız önerilir.
name: db-backup
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}
    steps:
      - name: Sırlar tanımlı mı?
        id: chk
        run: |
          if [ -z "$DATABASE_URL" ] || [ -z "$BACKUP_PASSPHRASE" ]; then echo "Sırlar yok, atlanıyor."; echo "skip=1" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.chk.outputs.skip != '1'
      - uses: actions/setup-python@v5
        if: steps.chk.outputs.skip != '1'
        with: { python-version: '3.12' }
      - if: steps.chk.outputs.skip != '1'
        run: |
          pip install -r apps/api/requirements-postgres.txt
          cd apps/api && BACKUP_DIR=$RUNNER_TEMP/bk BACKUP_KEEP=1 python -m app.backup create
          f=$(ls $RUNNER_TEMP/bk/*.json.gz)
          gpg --batch --yes --pinentry-mode loopback --passphrase "$BACKUP_PASSPHRASE" -c -o "$RUNNER_TEMP/academy-backup.json.gz.gpg" "$f"
      - uses: actions/upload-artifact@v4
        if: steps.chk.outputs.skip != '1'
        with: { name: "db-backup-${{ github.run_id }}", path: "${{ runner.temp }}/academy-backup.json.gz.gpg", retention-days: 90 }
