# docker compose up -d   →  http://localhost:8000
# Veriler "academy-data" biriminde (volume) kalıcıdır; konteyner silinse de korunur.
services:
  academy:
    build: .
    ports: ["8000:8000"]
    env_file: [.env]
    volumes: ["academy-data:/data"]
    restart: unless-stopped
volumes:
  academy-data:
